services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: tally_ho
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally_ho"]
      interval: 2s
      timeout: 3s
      retries: 20
